[workspace]
resolver = "2"
members = [
    "crates/flyte",
    "crates/flyte-macros",
    "examples/hello-trace",
    "examples/concurrent-traces",
    "examples/retry-replay",
    "examples/human-approval",
    "examples/custom-image",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/flyteorg/flyte-sdk-rs"

[workspace.dependencies]
# Must match what flyte_core pins exactly. Both are `=` requirements and the two
# crates pass flyteidl2 types across the boundary, so a mismatch is unresolvable
# rather than merely unsatisfying -- bump this together with flyte_core.
flyteidl2 = "=2.0.40"
prost = { version = "0.13", features = ["std"] }
tokio = { version = "1", features = ["full"] }
pyo3 = { version = "0.24", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.24", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"

# Examples depend on `flyte` by version, exactly as a user's crate does -- which
# is also what lets the worker image build from the example directory alone.
# In-workspace builds redirect that to the working tree, so `cargo test` and
# `cargo build` here still exercise local SDK changes rather than the release.
[patch.crates-io]
flyte = { path = "crates/flyte" }
flyte-macros = { path = "crates/flyte-macros" }
