# Publish the Rust crates to crates.io.
#
# Release train is independent from the Python package's (see
# release-python.yml). The two halves are coupled by the descriptor contract
# (`flyte_interface_version`), not by matching version numbers.
#
#   git tag rs-v0.2.0 && git push origin rs-v0.2.0
#
# BLOCKED until `flyte_core` is on crates.io. `crates/flyte` depends on it by git
# rev, and cargo refuses to publish a crate whose dependencies are not on the
# registry ("all dependencies must have a version requirement specified when
# publishing"). The preflight job below fails with exactly that error rather than
# tagging a release that cannot ship. See docs/releasing.md.
name: release-rust

on:
  push:
    tags: ["rs-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify and dry-run publish, but do not upload to crates.io"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify and dry-run publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # pyo3 links libpython at build time until the pure-Rust controller lands.
      - name: Install pyo3 build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev pkg-config

      # No `cargo fmt --check` gate here on purpose. The tree is not rustfmt-clean
      # (15 spots across crates/flyte and crates/flyte-macros), and a release
      # should not be blocked on style anyway — that belongs in PR CI. Run
      # `cargo fmt --all` and add the gate there once the tree is clean.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # A tag that disagrees with the manifest would publish a version nobody can
      # reproduce from the tree. Both crates inherit workspace.package.version.
      - name: Check tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#rs-v}"
          ws_version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import sys,json; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='flyte'))")
          echo "tag=$tag_version workspace=$ws_version"
          if [ "$tag_version" != "$ws_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $tag_version but the workspace says $ws_version"
            exit 1
          fi

      # Publish order matters: `flyte` depends on `flyte-macros`, so the macros
      # crate has to exist on the registry first. Dry-run in the same order.
      - name: Dry-run publish flyte-macros
        run: cargo publish --dry-run -p flyte-macros

      # Expected to fail while flyte_core is a git dependency. The error names
      # the offending dependency; that is the signal to publish flyte_core (or
      # vendor it) before cutting an rs-v* tag.
      - name: Dry-run publish flyte
        run: cargo publish --dry-run -p flyte

  publish:
    name: Publish to crates.io
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/flyte
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install pyo3 build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev pkg-config

      # Dependency order. Modern cargo blocks until each published crate is
      # visible in the index before returning, so `flyte` resolves the
      # just-published `flyte-macros` without a manual sleep.
      - name: Publish flyte-macros
        run: cargo publish -p flyte-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish flyte
        run: cargo publish -p flyte
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
