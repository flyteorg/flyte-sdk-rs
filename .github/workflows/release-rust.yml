# Publish the Rust crates to crates.io.
#
# Release train is independent from the Python package's (see
# release-python.yml). The two halves are coupled by the descriptor contract
# (`flyte_interface_version`), not by matching version numbers.
#
#   git tag rs-v0.2.0 && git push origin rs-v0.2.0
#
# Both crates publish as one batch. `flyte` depends on `flyte-macros`, so the
# order matters -- and publishing them separately cannot work for a first
# release, since dry-running `flyte` would look for a `flyte-macros` that is not
# on the registry yet. Passing both to one `cargo publish` makes cargo order them
# and resolve the sibling locally. Needs cargo 1.90+ for workspace publishing.
name: release-rust

on:
  push:
    tags: ["rs-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify and dry-run publish, but do not upload to crates.io"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify and dry-run publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # pyo3 links libpython at build time until the pure-Rust controller lands.
      - name: Install pyo3 build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev pkg-config

      # No `cargo fmt --check` gate here on purpose. The tree is not rustfmt-clean
      # (15 spots across crates/flyte and crates/flyte-macros), and a release
      # should not be blocked on style anyway — that belongs in PR CI. Run
      # `cargo fmt --all` and add the gate there once the tree is clean.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # A tag that disagrees with the manifest would publish a version nobody can
      # reproduce from the tree. Both crates inherit workspace.package.version.
      - name: Check tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#rs-v}"
          ws_version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import sys,json; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='flyte'))")
          echo "tag=$tag_version workspace=$ws_version"
          if [ "$tag_version" != "$ws_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $tag_version but the workspace says $ws_version"
            exit 1
          fi

      # One batch, not two steps: cargo orders them by dependency and resolves
      # `flyte`'s use of `flyte-macros` from the workspace. Dry-running them
      # separately would fail here for a first release, because `flyte` would
      # look for a `flyte-macros` that is not on the registry yet.
      - name: Dry-run publish
        run: cargo publish --dry-run -p flyte-macros -p flyte

  publish:
    name: Publish to crates.io
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/flyte
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install pyo3 build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev pkg-config

      # cargo publishes these in dependency order and waits for each to appear in
      # the index before starting the next, so `flyte` resolves the
      # just-published `flyte-macros` without a manual sleep.
      - name: Publish
        run: cargo publish -p flyte-macros -p flyte
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
