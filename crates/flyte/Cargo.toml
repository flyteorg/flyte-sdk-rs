[package]
name = "flyte"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Flyte SDK for Rust (v0: single-node traces)"

[dependencies]
# Transport (ActionsService enqueue/watch, informer, auth). Without its default
# `python` feature flyte_core brings no pyo3: the worker neither links libpython
# nor embeds an interpreter. To develop against a local checkout, add a
# [patch.crates-io] section pointing at it.
flyte_core = { version = "0.1", default-features = false }
flyte-macros = { path = "../flyte-macros", version = "0.1.0" }
flyteidl2 = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }
url = "2.5"
serde = { workspace = true }
rmp-serde = "1.3"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
# remote.rs: RunService over the same transport flyte_core uses.
tonic = { version = "0.12", features = ["tls"] }
tower = "0.4"
bytes = "1"

[dev-dependencies]
tempfile = "3"
